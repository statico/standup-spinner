<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standup Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --felt-1: #0a2a1c;
    --felt-2: #04150d;
    --brass: #d9a441;
    --brass-bright: #ffd479;
    --brass-dark: #8a6320;
    --neon: #ff2f5e;
    --neon-glow: #ff7aa0;
    --cream: #f6ecd2;
    --ink: #0a1410;
    --win: #46e08a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Oswald", sans-serif;
    color: var(--cream);
    background:
      radial-gradient(ellipse 120% 90% at 50% -10%, #14422c 0%, var(--felt-1) 40%, var(--felt-2) 100%);
    height: 100dvh;
    overflow: hidden;
    position: relative;
    -webkit-user-select: none;
    user-select: none;
  }
  input[type="text"] { -webkit-user-select: text; user-select: text; }

  /* felt noise + vignette */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 50% 40%, transparent 55%, rgba(0,0,0,0.55) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 4px);
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 1680px;
    margin: 0 auto;
    padding: 14px 28px 12px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------- marquee header ---------- */
  header { text-align: center; flex: none; }

  .bulbs {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
  }
  .bulb {
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 50%, var(--brass-dark));
    box-shadow: 0 0 10px var(--brass-bright), 0 0 22px rgba(217,164,65,0.6);
  }
  body.ready .bulb { animation: chase 1.1s steps(1) infinite; }
  .bulb:nth-child(2n) { animation-delay: 0.55s; }
  @keyframes chase {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; box-shadow: 0 0 4px var(--brass-dark); }
  }

  h1 {
    font-family: "Monoton", cursive;
    font-weight: 400;
    font-size: clamp(1.8rem, 4.2vw, 3.4rem);
    line-height: 0.95;
    letter-spacing: 2px;
    color: var(--neon);
    text-shadow:
      0 0 6px var(--neon),
      0 0 18px var(--neon),
      0 0 40px rgba(255,47,94,0.7),
      0 4px 0 rgba(0,0,0,0.4);
  }
  body.ready h1 { animation: flicker 6s infinite; }
  h1 .alt { color: var(--brass-bright);
    text-shadow: 0 0 6px var(--brass-bright), 0 0 20px var(--brass), 0 0 38px rgba(217,164,65,0.6), 0 4px 0 rgba(0,0,0,0.4); }
  @keyframes flicker {
    0%, 92%, 100% { opacity: 1; }
    93% { opacity: 0.55; }
    94% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
  }
  .tagline {
    font-family: "Bungee", cursive;
    font-size: 0.72rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--brass);
    margin-top: 6px;
  }

  /* ---------- layout ---------- */
  .stage {
    display: grid;
    grid-template-columns: minmax(340px, 0.9fr) minmax(420px, 1.15fr);
    gap: 20px;
    margin-top: 12px;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }

  .panel {
    background:
      linear-gradient(160deg, rgba(255,255,255,0.04), rgba(0,0,0,0.25)),
      var(--felt-2);
    border: 2px solid var(--brass-dark);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow:
      inset 0 0 0 4px rgba(0,0,0,0.35),
      inset 0 0 30px rgba(0,0,0,0.5),
      0 18px 40px rgba(0,0,0,0.5);
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-title {
    font-family: "Bungee", cursive;
    font-size: 0.95rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brass-bright);
    margin-bottom: 10px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title .count {
    font-family: "Oswald";
    font-size: 0.8rem;
    color: var(--brass);
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--brass-dark);
    border-radius: 999px;
    padding: 2px 12px;
  }

  /* ---------- add form ---------- */
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; flex: none; }
  #nameInput {
    flex: 1;
    font-family: "Oswald", sans-serif;
    font-size: 1.05rem;
    color: var(--cream);
    background: rgba(0,0,0,0.45);
    border: 1px solid var(--brass-dark);
    border-radius: 10px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #nameInput::placeholder { color: rgba(246,236,210,0.35); }
  #nameInput:focus {
    border-color: var(--brass);
    box-shadow: 0 0 0 3px rgba(217,164,65,0.18);
  }
  .btn {
    font-family: "Bungee", cursive;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s;
    user-select: none;
  }
  .btn:active { transform: translateY(2px); }
  .btn-add {
    background: linear-gradient(180deg, var(--brass-bright), var(--brass) 60%, var(--brass-dark));
    color: var(--ink);
    font-size: 0.85rem;
    padding: 0 18px;
    box-shadow: 0 4px 0 var(--brass-dark);
  }
  .btn-add:hover { filter: brightness(1.08); }
  .btn-add:active { box-shadow: 0 2px 0 var(--brass-dark); }

  /* ---------- roster ---------- */
  ul { list-style: none; }
  #rosterList {
    overflow: auto;
    min-height: 0;
    flex: 1;
    padding-right: 2px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    align-content: start;
    gap: 6px;
  }
  #rosterList .roster-item { margin-bottom: 0; }
  #rosterList .empty { grid-column: 1 / -1; }
  #rosterList,
  .reels {
    scrollbar-gutter: stable;
    scrollbar-width: thin;
    scrollbar-color: var(--brass) rgba(0, 0, 0, 0.45);
  }
  #rosterList::-webkit-scrollbar,
  .reels::-webkit-scrollbar { width: 10px; }
  #rosterList::-webkit-scrollbar-track,
  .reels::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.45);
    border-radius: 999px;
  }
  #rosterList::-webkit-scrollbar-thumb,
  .reels::-webkit-scrollbar-thumb {
    background: var(--brass-dark);
    border: 2px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  .roster-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(217,164,65,0.18);
    margin-bottom: 8px;
    cursor: pointer;
    transition: opacity 0.2s, border-color 0.2s, background 0.2s;
  }
  .roster-item:hover { border-color: rgba(217,164,65,0.45); }
  .roster-item.entering { animation: slidein 0.28s ease backwards; }
  @keyframes slidein {
    from { opacity: 0; transform: translateX(-12px); }
  }
  .roster-item.disabled { opacity: 0.4; }
  .roster-item .who { flex: 1; min-width: 0; }
  .roster-item .name { font-size: 1.1rem; font-weight: 500; }
  .roster-item .stat {
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(217,164,65,0.7);
    margin-top: 2px;
  }
  .roster-item.disabled .name { text-decoration: line-through; }

  /* custom checkbox */
  .check {
    appearance: none;
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border: 2px solid var(--brass);
    border-radius: 6px;
    background: rgba(0,0,0,0.4);
    cursor: pointer;
    position: relative;
    flex: none;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .check:checked {
    background: var(--brass);
    box-shadow: 0 0 10px rgba(217,164,65,0.7);
  }
  .check:checked::after {
    content: "";
    position: absolute;
    /* pseudo-elements skip the * border-box rule; the visible L sits ~2px below the rotated box center */
    left: 50%; top: calc(50% - 2px);
    width: 6px; height: 11px;
    border: solid var(--ink);
    border-width: 0 3px 3px 0;
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .del {
    background: transparent;
    border: 1px solid rgba(255,47,94,0.4);
    color: var(--neon-glow);
    width: 28px; height: 28px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    flex: none;
    transition: background 0.15s, color 0.15s, transform 0.08s;
  }
  .del:hover { background: var(--neon); color: #fff; border-color: var(--neon); }
  .del:active { transform: scale(0.9); }

  .superlatives {
    margin-top: 8px;
    padding-top: 8px;
    flex: none;
    border-top: 1px dashed rgba(217,164,65,0.3);
    display: grid;
    gap: 6px;
    font-size: 0.9rem;
  }
  .superlatives:empty { display: none; }
  .superlatives .title { color: var(--brass); font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; }
  .superlatives .title strong { display: block; color: var(--cream); font-size: 1rem; letter-spacing: 0; text-transform: none; font-weight: 500; }

  .empty {
    text-align: center;
    color: rgba(246,236,210,0.4);
    font-style: italic;
    padding: 24px 0;
  }

  /* ---------- machine / right column ---------- */
  .machine { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .reels-frame {
    background:
      linear-gradient(180deg, #1a0d05, #2a1608);
    border: 3px solid var(--brass);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow:
      inset 0 0 0 3px var(--brass-dark),
      inset 0 6px 22px rgba(0,0,0,0.8),
      0 0 40px rgba(217,164,65,0.15),
      0 20px 50px rgba(0,0,0,0.55);
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .reels-frame::before {
    content: "★ ★ ★";
    position: absolute;
    top: -13px; left: 50%; transform: translateX(-50%);
    background: var(--felt-2);
    color: var(--brass-bright);
    font-size: 0.7rem;
    letter-spacing: 6px;
    padding: 2px 14px;
    border-radius: 999px;
    border: 2px solid var(--brass);
  }

  .reels { display: flex; flex-direction: column; gap: 6px; overflow: auto; min-height: 0; flex: 1; }

  /* a result line = position badge + reel window */
  .line {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.55);
    border-radius: 10px;
    border: 1px solid rgba(217,164,65,0.25);
    padding: 6px 12px 6px 6px;
    transition: border-color 0.25s, background 0.25s, opacity 0.25s;
  }
  .line.locked { border-color: var(--brass); box-shadow: 0 0 14px rgba(217,164,65,0.25); cursor: pointer; }
  .line.done { opacity: 0.55; }

  .pos {
    font-family: "Bungee", cursive;
    font-size: 1.2rem;
    width: 44px; height: 44px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 9px;
    color: var(--ink);
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 60%, var(--brass-dark));
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3);
  }

  .reel-window {
    flex: 1;
    height: 52px;
    overflow: hidden;
    position: relative;
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.6), transparent 22%, transparent 78%, rgba(0,0,0,0.6));
    mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent);
  }
  .reel-strip {
    display: flex;
    flex-direction: column;
    will-change: transform;
  }
  .reel-cell {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 6px;
    font-size: 1.5rem;
    font-weight: 600;
    white-space: nowrap;
    color: var(--cream);
  }
  .reel-window.spinning .reel-cell { filter: blur(1.2px); }
  .line.locked .reel-cell { color: var(--brass-bright); text-shadow: 0 0 12px rgba(255,212,121,0.5); }

  /* done check on result lines */
  .line .done-check {
    appearance: none; -webkit-appearance: none;
    width: 30px; height: 30px;
    flex: none;
    border: 2px solid var(--win);
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    cursor: pointer;
    position: relative;
    transition: background 0.15s, box-shadow 0.15s, opacity 0.2s;
    opacity: 0;
    pointer-events: none;
  }
  .line.locked .done-check { opacity: 1; pointer-events: auto; }
  .line .done-check:checked { background: var(--win); box-shadow: 0 0 12px rgba(70,224,138,0.7); }
  .line .done-check:checked::after {
    content: "";
    position: absolute; left: 50%; top: calc(50% - 2.5px);
    width: 7px; height: 13px;
    border: solid var(--ink); border-width: 0 3px 3px 0;
    transform: translate(-50%, -50%) rotate(45deg);
  }
  .line.done .reel-cell { text-decoration: line-through; color: rgba(246,236,210,0.5); text-shadow: none; }

  .placeholder-msg {
    text-align: center;
    color: rgba(246,236,210,0.45);
    padding: 70px 20px;
    font-size: 1.15rem;
  }
  .placeholder-msg .big {
    font-family: "Bungee", cursive;
    font-size: 1.5rem;
    color: var(--brass);
    display: block;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  /* ---------- lever / spin ---------- */
  .controls { display: flex; gap: 14px; align-items: stretch; flex: none; }
  .meter { flex: none; }
  .btn-spin {
    flex: 1;
    background: linear-gradient(180deg, var(--neon-glow), var(--neon) 55%, #b01038);
    color: #fff;
    font-size: 1.25rem;
    padding: 12px 18px;
    letter-spacing: 3px;
    box-shadow:
      0 6px 0 #7a0c28,
      0 12px 28px rgba(255,47,94,0.4),
      inset 0 2px 4px rgba(255,255,255,0.3);
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .btn-spin::after {
    content: "";
    position: absolute; top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
  }
  body.ready .btn-spin::after { animation: sheen 3.5s ease-in-out infinite; }
  @keyframes sheen { 0%, 70% { left: -60%; } 100% { left: 160%; } }
  .btn-spin:hover { filter: brightness(1.07); }
  .btn-spin:active { box-shadow: 0 2px 0 #7a0c28, 0 4px 12px rgba(255,47,94,0.3), inset 0 2px 4px rgba(255,255,255,0.3); }
  .btn-spin:disabled {
    background: linear-gradient(180deg, #555, #333);
    color: rgba(255,255,255,0.4);
    box-shadow: 0 4px 0 #1a1a1a;
    cursor: not-allowed;
    filter: none;
  }
  .btn-spin:disabled::after { display: none; }

  .btn-reset {
    background: transparent;
    border: 2px solid var(--brass-dark);
    color: var(--brass);
    font-size: 0.85rem;
    padding: 0 18px;
  }
  .btn-reset:hover { border-color: var(--brass); color: var(--brass-bright); }
  .btn-reset:disabled { opacity: 0.4; cursor: not-allowed; }

  /* progress bar */
  .progress {
    height: 8px;
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    overflow: hidden;
    border: 1px solid rgba(217,164,65,0.25);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--brass), var(--win));
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .progress-label {
    text-align: center;
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brass);
    margin-top: 8px;
  }
  .all-done {
    color: var(--win) !important;
    font-family: "Bungee", cursive;
    animation: pop 0.5s ease;
  }
  @keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }

  /* celebration canvas */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  /* celebration overlay message */
  #bigmsg {
    position: fixed;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%) scale(0.4);
    z-index: 60;
    pointer-events: none;
    font-family: "Bungee", cursive;
    font-size: clamp(2.2rem, 9vw, 6rem);
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    color: var(--brass-bright);
    text-shadow: 0 0 12px var(--brass-bright), 0 0 30px var(--brass), 0 6px 0 rgba(0,0,0,0.45);
  }
  #bigmsg.show { animation: bigpop 2.2s cubic-bezier(.2,.9,.2,1) forwards; }
  #bigmsg.fire, #bigmsg.party {
    color: var(--neon-glow);
    text-shadow: 0 0 12px var(--neon), 0 0 34px var(--neon), 0 6px 0 rgba(0,0,0,0.45);
  }
  #bigmsg.star { color: #fff; text-shadow: 0 0 14px var(--brass-bright), 0 0 44px var(--brass); }
  @keyframes bigpop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.4) rotate(-6deg); }
    14%  { opacity: 1; transform: translate(-50%,-50%) scale(1.18) rotate(2deg); }
    24%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    78%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.12); }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-7px, 3px); }
    20% { transform: translate(8px, -4px); }
    30% { transform: translate(-9px, -2px); }
    40% { transform: translate(7px, 4px); }
    50% { transform: translate(-6px, 3px); }
    60% { transform: translate(7px, -3px); }
    70% { transform: translate(-5px, 2px); }
    80% { transform: translate(5px, -2px); }
    90% { transform: translate(-3px, 1px); }
  }
  .wrap.shake { animation: shake 0.65s ease; }

  .credit {
    text-align: center;
    margin-top: 8px;
    flex: none;
    color: rgba(246,236,210,0.3);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @media (max-width: 820px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .wrap { height: auto; min-height: 100dvh; padding: 20px 16px 32px; }
    .stage { grid-template-columns: 1fr; }
    #rosterList { display: block; overflow: visible; }
    #rosterList .roster-item { margin-bottom: 8px; }
    .reels { overflow: visible; }
    .panel, .reels-frame { min-height: auto; }
    h1 { font-size: clamp(2.2rem, 11vw, 3.2rem); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="bulbs">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span>
      </div>
      <h1>Standup <span class="alt">Spinner</span></h1>
      <div class="tagline">Place your bets · who goes first?</div>
    </header>

    <div class="stage">
      <!-- LEFT: roster -->
      <section class="panel">
        <div class="panel-title">
          The Roster
          <span class="count" id="rosterCount">0 in play</span>
        </div>
        <div class="add-row">
          <input id="nameInput" type="text" placeholder="Add a teammate…" maxlength="32" autocomplete="off" />
          <button class="btn btn-add" id="addBtn">Add</button>
        </div>
        <ul id="rosterList"></ul>
        <div class="superlatives" id="superlatives"></div>
      </section>

      <!-- RIGHT: machine -->
      <section class="machine">
        <div class="reels-frame">
          <div class="reels" id="reels">
            <div class="placeholder-msg">
              <span class="big">Ready to roll?</span>
              Add your team, then pull the lever to draw the running order.
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-spin" id="spinBtn" disabled>Spin</button>
          <button class="btn btn-reset" id="resetBtn">Clear</button>
        </div>

        <div class="meter">
          <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-label" id="progressLabel">No order drawn yet</div>
        </div>
      </section>
    </div>

    <div class="credit">Pull the lever · settle the running order</div>
  </div>

  <canvas id="confetti"></canvas>
  <div id="bigmsg"></div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "standup-roulette-v1";

  // ---------- state ----------
  /** @type {{roster: {id:string,name:string,enabled:boolean}[], result: {id:string,name:string,done:boolean}[]|null, stats: Record<string,{spins:number,first:number,last:number}>}} */
  let state = load();
  let spinning = false;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        return {
          roster: Array.isArray(p.roster) ? p.roster : [],
          result: Array.isArray(p.result) ? p.result : null,
          stats: p.stats && typeof p.stats === "object" ? p.stats : {},
        };
      }
    } catch (e) { /* ignore */ }
    return { roster: [], result: null, stats: {} };
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* ignore */ }
  }

  function uid() {
    return "id-" + Math.random().toString(36).slice(2, 9) + "-" + (++uid._c);
  }
  uid._c = 0;

  // ---------- elements ----------
  const $ = (id) => document.getElementById(id);
  const nameInput = $("nameInput");
  const addBtn = $("addBtn");
  const rosterList = $("rosterList");
  const rosterCount = $("rosterCount");
  const superlatives = $("superlatives");
  const reels = $("reels");
  const spinBtn = $("spinBtn");
  const resetBtn = $("resetBtn");
  const progressFill = $("progressFill");
  const progressLabel = $("progressLabel");

  // ---------- roster CRUD ----------
  function addName(raw) {
    const name = raw.trim();
    if (!name) return;
    const p = { id: uid(), name, enabled: true };
    state.roster.push(p);
    save();
    // targeted insert — no full re-render, so existing rows don't blink/re-animate
    const emptyEl = rosterList.querySelector(".empty");
    if (emptyEl) emptyEl.remove();
    const li = makeRosterItem(p);
    li.classList.add("entering"); // play the slide-in once, for the new row only
    rosterList.appendChild(li);
    popAt(li, GOOD, 24);
    blip(660, 1320, "triangle", 0.14);
    updateRosterCount();
    updateControls();
    renderSuperlatives();
  }

  function deleteName(id) {
    state.roster = state.roster.filter((x) => x.id !== id);
    delete state.stats[id];
    save();
    renderSuperlatives();
    const li = rosterList.querySelector('.roster-item[data-id="' + id + '"]');
    if (li) { popAt(li, BAD, 30); li.remove(); }
    boom();
    blip(300, 80, "sawtooth", 0.2, 0.06);
    if (state.roster.length === 0) renderEmptyRoster();
    updateRosterCount();
    updateControls();
  }

  function toggleEnabled(id) {
    const p = state.roster.find((x) => x.id === id);
    if (!p) return;
    p.enabled = !p.enabled;
    save();
    // touch only the affected row — avoids re-rendering (and re-animating) the whole list
    const li = rosterList.querySelector('.roster-item[data-id="' + id + '"]');
    if (li) {
      li.classList.toggle("disabled", !p.enabled);
      const cb = li.querySelector(".check");
      if (cb) {
        cb.checked = p.enabled;
        cb.title = p.enabled ? "Playing — click to bench" : "Benched — click to play";
      }
    }
    updateRosterCount();
    updateControls();
    if (li) popAt(li.querySelector(".check"), p.enabled ? GOOD : BAD, p.enabled ? 18 : 10);
    if (p.enabled) blip(520, 880, "triangle", 0.12); else blip(420, 200, "sine", 0.15);
  }

  function enabledNames() {
    return state.roster.filter((p) => p.enabled);
  }

  // ---------- rendering ----------
  function makeRosterItem(p) {
    const li = document.createElement("li");
    li.className = "roster-item" + (p.enabled ? "" : " disabled");
    li.dataset.id = p.id;

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "check";
    cb.checked = p.enabled;
    cb.title = p.enabled ? "Playing — click to bench" : "Benched — click to play";
    cb.addEventListener("change", () => toggleEnabled(p.id));

    const who = document.createElement("div");
    who.className = "who";
    const span = document.createElement("span");
    span.className = "name";
    span.textContent = p.name;
    const stat = document.createElement("div");
    stat.className = "stat";
    stat.textContent = statText(p.id);
    who.append(span, stat);

    const del = document.createElement("button");
    del.className = "del";
    del.innerHTML = "&times;";
    del.title = "Remove";
    del.addEventListener("click", () => deleteName(p.id));

    li.append(cb, who, del);
    // the whole row toggles play/bench; the checkbox handles its own click, the × removes
    li.addEventListener("click", (e) => {
      if (e.target === cb || e.target.closest(".del")) return;
      cb.click();
    });
    return li;
  }

  function renderEmptyRoster() {
    rosterList.innerHTML = "";
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No players yet. Add your team above.";
    rosterList.appendChild(li);
  }

  function statText(id) {
    const s = state.stats[id];
    if (!s) return "No spins yet";
    return s.spins + (s.spins === 1 ? " spin" : " spins") + " · first ×" + s.first + " · last ×" + s.last;
  }

  function updateStat(id) {
    const el = rosterList.querySelector('.roster-item[data-id="' + id + '"] .stat');
    if (el) el.textContent = statText(id);
  }

  // one line per stat naming the current leader(s); nothing shown until someone has a count
  const SUPERLATIVES = [
    ["🐦 Early bird", "first", "first"],
    ["🏁 Closer", "last", "last"],
    ["🎰 High roller", "spins", "spins"],
  ];
  function renderSuperlatives() {
    superlatives.innerHTML = "";
    SUPERLATIVES.forEach(([label, key, unit]) => {
      let max = 0, names = [], played = 0;
      state.roster.forEach((p) => {
        const v = (state.stats[p.id] || {})[key] || 0;
        if (v > 0) played++;
        if (v > max) { max = v; names = [p.name]; }
        else if (v === max && v > 0) names.push(p.name);
      });
      if (max === 0 || names.length === played) return; // nobody stands out yet
      const row = document.createElement("div");
      row.className = "title";
      row.textContent = label + " · " + max + " " + unit;
      const who = document.createElement("strong");
      who.textContent = names.join(" & ");
      row.appendChild(who);
      superlatives.appendChild(row);
    });
  }

  function updateRosterCount() {
    rosterCount.textContent = enabledNames().length + " in play";
  }

  // full render — only on initial load
  function renderRoster() {
    rosterList.innerHTML = "";
    if (state.roster.length === 0) {
      renderEmptyRoster();
    } else {
      state.roster.forEach((p, i) => {
        const li = makeRosterItem(p);
        li.classList.add("entering");
        li.style.animationDelay = (i * 0.03) + "s";
        rosterList.appendChild(li);
      });
    }
    updateRosterCount();
  }

  function updateControls() {
    const n = enabledNames().length;
    spinBtn.disabled = spinning || n < 2;
    resetBtn.disabled = spinning;
    spinBtn.textContent = spinning ? "Spinning…" : (state.result ? "Re-spin" : "Spin");
    // decorative header/button animations only run in the cleared "ready to roll?" state
    document.body.classList.toggle("ready", state.result === null && !spinning);
  }

  // ---------- result rendering ----------
  function renderResult() {
    if (!state.result) {
      reels.innerHTML =
        '<div class="placeholder-msg"><span class="big">Ready to roll?</span>' +
        "Add your team, then pull the lever to draw the running order.</div>";
      updateProgress();
      return;
    }
    reels.innerHTML = "";
    state.result.forEach((r, i) => {
      reels.appendChild(buildLine(i + 1, r, true));
    });
    updateProgress();
  }

  function buildLine(pos, r, locked) {
    const line = document.createElement("div");
    line.className = "line" + (locked ? " locked" : "") + (r.done ? " done" : "");
    line.dataset.id = r.id;

    const badge = document.createElement("div");
    badge.className = "pos";
    badge.textContent = pos;

    const win = document.createElement("div");
    win.className = "reel-window";
    const strip = document.createElement("div");
    strip.className = "reel-strip";
    const cell = document.createElement("div");
    cell.className = "reel-cell";
    cell.textContent = r.name;
    strip.appendChild(cell);
    win.appendChild(strip);

    const done = document.createElement("input");
    done.type = "checkbox";
    done.className = "done-check";
    done.checked = !!r.done;
    done.title = "Mark as presented";
    done.addEventListener("change", () => toggleDone(r.id, done.checked));

    line.append(badge, win, done);
    line.addEventListener("click", (e) => {
      if (e.target === done || !line.classList.contains("locked")) return;
      done.click();
    });
    return line;
  }

  function toggleDone(id, val) {
    if (!state.result) return;
    const r = state.result.find((x) => x.id === id);
    if (!r) return;
    r.done = val;
    save();
    const line = reels.querySelector('.line[data-id="' + id + '"]');
    if (line) line.classList.toggle("done", val);
    updateProgress();
    if (line) {
      const n = state.result.filter((x) => x.done).length;
      if (val) {
        popAt(line.querySelector(".done-check"), GOOD, 26);
        blip(440 * Math.pow(2, n / state.result.length), 1760, "square", 0.1, 0.06); // climbs as the team finishes
      } else {
        blip(500, 250, "sine", 0.12);
      }
    }
    // the moment the LAST person is checked off, fire a random celebration
    if (val && state.result.length > 0 && state.result.every((x) => x.done)) {
      celebrate();
    }
  }

  function updateProgress() {
    if (!state.result || state.result.length === 0) {
      progressFill.style.width = "0%";
      progressLabel.textContent = "No order drawn yet";
      progressLabel.classList.remove("all-done");
      return;
    }
    const total = state.result.length;
    const done = state.result.filter((r) => r.done).length;
    progressFill.style.width = Math.round((done / total) * 100) + "%";
    if (done === total) {
      progressLabel.textContent = "🏁 Standup complete!";
      progressLabel.classList.add("all-done");
    } else {
      progressLabel.textContent = done + " of " + total + " presented";
      progressLabel.classList.remove("all-done");
    }
  }

  // ---------- the SPIN ----------
  const CELL_H = 52;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function spin() {
    if (spinning) return;
    const players = enabledNames();
    if (players.length < 2) return;

    spinning = true;
    state.result = null;
    save();
    updateControls();

    const order = shuffle(players).map((p) => ({ id: p.id, name: p.name, done: false }));
    const pool = players.map((p) => p.name);

    // build spinning lines
    reels.innerHTML = "";
    const lines = order.map((r, i) => {
      const line = buildLine(i + 1, r, false);
      const win = line.querySelector(".reel-window");
      const strip = line.querySelector(".reel-strip");
      win.classList.add("spinning");
      // long random strip ending on the target name (capped so big teams stay snappy)
      const reelLen = 26 + Math.min(i, 8) * 6;
      strip.innerHTML = "";
      for (let k = 0; k < reelLen; k++) {
        const cell = document.createElement("div");
        cell.className = "reel-cell";
        cell.textContent = pool[Math.floor(Math.random() * pool.length)];
        strip.appendChild(cell);
      }
      const target = document.createElement("div");
      target.className = "reel-cell";
      target.textContent = r.name;
      strip.appendChild(target);
      reels.appendChild(line);
      return { line, win, strip, reelLen };
    });

    // animate each reel, staggered, decelerating to its target
    let landed = 0;
    lines.forEach((L, i) => {
      const travel = L.reelLen * CELL_H;
      // cap the per-position growth so a 20-person team doesn't wait ~14s
      const dur = 1500 + Math.min(i, 6) * 420;
      const startDelay = 120 + Math.min(i, 10) * 80;

      // kick off from 0
      L.strip.style.transform = "translateY(0px)";
      requestAnimationFrame(() => {
        setTimeout(() => {
          L.strip.style.transition =
            "transform " + dur + "ms cubic-bezier(0.12, 0.7, 0.1, 1)";
          L.strip.style.transform = "translateY(-" + travel + "px)";
        }, startDelay);
      });

      let ended = false;
      const onEnd = () => {
        if (ended) return; // idempotent: guard against transitionend + safety-timeout double fire
        ended = true;
        L.win.classList.remove("spinning");
        L.line.classList.add("locked");
        L.strip.style.transition = "transform 140ms cubic-bezier(.3,1.6,.5,1)";
        L.strip.style.transform = "translateY(-" + (travel - 4) + "px)";
        setTimeout(() => { L.strip.style.transform = "translateY(-" + travel + "px)"; }, 140);
        thunk(220 + i * 30);
        landed++;
        if (landed === lines.length) finishSpin(order);
      };
      L.strip.addEventListener("transitionend", onEnd, { once: true });
      // safety fallback in case transitionend doesn't fire
      setTimeout(() => {
        if (!L.line.classList.contains("locked")) onEnd();
      }, startDelay + dur + 400);
    });
  }

  function finishSpin(order) {
    spinning = false;
    state.result = order;
    order.forEach((r, i) => {
      if (!state.roster.some((p) => p.id === r.id)) return; // removed mid-spin
      const s = state.stats[r.id] || (state.stats[r.id] = { spins: 0, first: 0, last: 0 });
      s.spins++;
      if (i === 0) s.first++;
      if (i === order.length - 1) s.last++;
    });
    save();
    order.forEach((r) => updateStat(r.id));
    renderSuperlatives();
    updateControls();
    updateProgress();
    fanfare();
    burstConfetti();
  }

  // ---------- audio (WebAudio, no assets) ----------
  let audioCtx = null;
  function ac() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }
  function thunk(freq) {
    const ctx = ac(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.2);
  }
  function fanfare() {
    const ctx = ac(); if (!ctx) return;
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = f;
      const t = ctx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.32);
    });
  }
  function coinChime() {
    const ctx = ac(); if (!ctx) return;
    [784, 988, 1175, 1568].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square";
      o.frequency.value = f;
      const t = ctx.currentTime + i * 0.07;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.1, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.24);
    });
  }
  function whistle() {
    const ctx = ac(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    const t = ctx.currentTime;
    o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(1500, t + 0.3);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.34);
  }
  function boom() {
    const ctx = ac(); if (!ctx) return;
    const dur = 0.4;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
    }
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start();
  }
  // short pitch-sliding tone for UI clicks
  function blip(from, to, type, dur, vol) {
    const ctx = ac(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime;
    o.type = type || "sine";
    o.frequency.setValueAtTime(from, t);
    o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // ---------- particle engine ----------
  const canvas = $("confetti");
  const cctx = canvas.getContext("2d");
  const bigmsg = $("bigmsg");
  let parts = [];
  let rafId = null;
  function sizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", sizeCanvas);
  sizeCanvas();

  const PALETTE = ["#ffd479", "#ff2f5e", "#46e08a", "#f6ecd2", "#d9a441"];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function spawn(p) {
    p.life = 0;
    p.maxLife = p.maxLife || 400;
    p.vx = p.vx || 0;
    p.vy = p.vy || 0;
    p.g = p.g == null ? 0.3 : p.g;
    p.drag = p.drag == null ? 0.99 : p.drag;
    p.rot = p.rot || 0;
    p.vr = p.vr || 0;
    parts.push(p);
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function tick() {
    cctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter((p) => p.life < p.maxLife && p.y < canvas.height + 90);
    for (const p of parts) {
      p.life++;
      p.vy += p.g;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      drawPart(p);
    }
    if (parts.length > 0) {
      rafId = requestAnimationFrame(tick);
    } else {
      cctx.clearRect(0, 0, canvas.width, canvas.height);
      rafId = null;
    }
  }

  function fadeAlpha(p) {
    const t = p.life / p.maxLife; // fade out over the last 25% of life
    return t > 0.75 ? Math.max(0, 1 - (t - 0.75) / 0.25) : 1;
  }

  function drawPart(p) {
    cctx.save();
    cctx.globalAlpha = (p.alpha != null ? p.alpha : 1) * fadeAlpha(p);
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    if (p.kind === "coin") {
      const r = p.size;
      cctx.scale(Math.max(0.16, Math.abs(Math.cos(p.life * 0.2 + p.phase))), 1); // fake spin
      cctx.beginPath();
      cctx.arc(0, 0, r, 0, Math.PI * 2);
      cctx.fillStyle = "#ffcf3f";
      cctx.fill();
      cctx.lineWidth = Math.max(1, r * 0.18);
      cctx.strokeStyle = "#a9760f";
      cctx.stroke();
      cctx.fillStyle = "#fff3c4";
      cctx.font = "bold " + (r * 1.1) + "px Bungee, sans-serif";
      cctx.textAlign = "center";
      cctx.textBaseline = "middle";
      cctx.fillText("$", 0, r * 0.06);
    } else if (p.kind === "spark") {
      cctx.beginPath();
      cctx.arc(0, 0, p.size, 0, Math.PI * 2);
      cctx.fillStyle = p.color;
      cctx.shadowColor = p.color;
      cctx.shadowBlur = 12;
      cctx.fill();
    } else if (p.kind === "glyph") {
      cctx.font = "bold " + p.size + "px " + (p.font || "serif");
      cctx.textAlign = "center";
      cctx.textBaseline = "middle";
      if (p.color) { cctx.fillStyle = p.color; cctx.shadowColor = p.color; cctx.shadowBlur = 10; }
      cctx.fillText(p.char, 0, 0);
    } else { // confetti rectangle
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    }
    cctx.restore();
  }

  // small confetti pop used when the order is first drawn
  function burstConfetti() {
    for (let i = 0; i < 140; i++) {
      spawn({
        kind: "confetti",
        x: canvas.width / 2 + rand(-100, 100),
        y: canvas.height * 0.32,
        vx: rand(-6, 6),
        vy: rand(-16, -4),
        g: rand(0.3, 0.5),
        size: rand(5, 12),
        color: pick(PALETTE),
        rot: Math.random() * Math.PI,
        vr: rand(-0.15, 0.15),
        maxLife: 260,
      });
    }
  }

  // radial spark + confetti pop centered on a clicked element
  function popAt(el, colors, n) {
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(2, 7);
      const spark = i % 2 === 0;
      spawn({
        kind: spark ? "spark" : "confetti", x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        g: spark ? 0.08 : 0.25, drag: 0.93,
        size: spark ? rand(1.5, 3.5) : rand(4, 8),
        color: pick(colors),
        rot: Math.random() * Math.PI, vr: rand(-0.3, 0.3),
        maxLife: rand(35, 60),
      });
    }
  }
  const GOOD = ["#46e08a", "#ffd479", "#f6ecd2"];
  const BAD = ["#ff2f5e", "#ff9f40", "#8a8a8a"];

  // ---------- overlay + screen shake ----------
  let bigmsgTimer = null;
  function showBigMsg(text, theme) {
    bigmsg.textContent = text;
    bigmsg.className = "";
    void bigmsg.offsetWidth; // reflow so the animation restarts
    bigmsg.className = "show" + (theme ? " " + theme : "");
    clearTimeout(bigmsgTimer);
    bigmsgTimer = setTimeout(() => { bigmsg.className = ""; }, 2200);
  }
  function shake() {
    const w = document.querySelector(".wrap");
    w.classList.remove("shake");
    void w.offsetWidth;
    w.classList.add("shake");
    setTimeout(() => w.classList.remove("shake"), 700);
  }

  // ---------- celebrations (one picked at random on completion) ----------
  function fxCoinJackpot() {
    showBigMsg("JACKPOT!");
    shake();
    coinChime();
    const cx = canvas.width / 2;
    const erupt = (n, delay) => setTimeout(() => {
      for (let i = 0; i < n; i++) {
        spawn({
          kind: "coin",
          x: cx + rand(-90, 90),
          y: canvas.height + 20,
          vx: rand(-9, 9),
          vy: rand(-27, -16),
          g: rand(0.55, 0.82),
          drag: 0.995,
          size: rand(10, 20),
          phase: rand(0, 6),
          vr: rand(-0.1, 0.1),
          maxLife: 320,
        });
      }
    }, delay);
    erupt(45, 0); erupt(40, 170); erupt(30, 340);
    setTimeout(() => { // a few also rain from above
      for (let i = 0; i < 28; i++) spawn({
        kind: "coin", x: rand(0, canvas.width), y: -20,
        vy: rand(2, 6), g: 0.32, drag: 0.999,
        size: rand(8, 16), phase: rand(0, 6), maxLife: 380,
      });
    }, 220);
  }

  function fxConfettiCannons() {
    showBigMsg("🎉 NICE WORK 🎉", "party");
    fanfare();
    const shoot = (originX, dir) => {
      for (let i = 0; i < 90; i++) spawn({
        kind: "confetti",
        x: originX, y: canvas.height + 10,
        vx: dir * rand(3, 14) + rand(-2, 2),
        vy: rand(-23, -10),
        g: rand(0.32, 0.5),
        size: rand(6, 13),
        color: pick(PALETTE),
        rot: Math.random() * Math.PI, vr: rand(-0.2, 0.2),
        maxLife: 290,
      });
    };
    shoot(40, 1); shoot(canvas.width - 40, -1);
    setTimeout(() => { shoot(40, 1); shoot(canvas.width - 40, -1); }, 250);
  }

  function fxFireworks() {
    showBigMsg("🎆 SHIP IT 🎆", "fire");
    const colors = ["#ffd479", "#ff2f5e", "#46e08a", "#7ad0ff", "#f6ecd2", "#ff9f40"];
    const burst = (x, y, color) => {
      boom();
      const n = 56;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const sp = rand(3, 8);
        spawn({
          kind: "spark", x, y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          g: 0.06, drag: 0.92,
          size: rand(2, 4), color,
          maxLife: rand(55, 85),
        });
      }
    };
    for (let k = 0; k < 6; k++) {
      setTimeout(() => {
        whistle();
        burst(rand(canvas.width * 0.2, canvas.width * 0.8),
              rand(canvas.height * 0.15, canvas.height * 0.5), pick(colors));
      }, k * 340);
    }
  }

  function fxStarShower() {
    showBigMsg("🏆 CHAMPIONS 🏆", "star");
    fanfare();
    for (let i = 0; i < 90; i++) {
      setTimeout(() => spawn({
        kind: "glyph", char: "★", color: "#ffd479",
        x: rand(0, canvas.width), y: rand(-40, -10),
        vx: rand(-1, 1), vy: rand(1.5, 4),
        g: 0.02, drag: 0.999,
        size: rand(12, 28),
        rot: rand(0, Math.PI), vr: rand(-0.05, 0.05),
        maxLife: 360,
      }), i * 18);
    }
  }

  function fxEmojiParty() {
    showBigMsg("🥳 STANDUP DONE 🥳", "party");
    fanfare();
    const emojis = ["🎉", "🥳", "🎊", "🍾", "⭐", "🙌", "🏁", "💥"];
    for (let i = 0; i < 70; i++) {
      spawn({
        kind: "glyph", char: pick(emojis), font: "sans-serif",
        x: canvas.width / 2 + rand(-70, 70), y: canvas.height * 0.52,
        vx: rand(-11, 11), vy: rand(-21, -6),
        g: rand(0.4, 0.6), drag: 0.995,
        size: rand(22, 42),
        rot: rand(-0.5, 0.5), vr: rand(-0.2, 0.2),
        maxLife: 300,
      });
    }
  }

  const CELEBRATIONS = [fxCoinJackpot, fxConfettiCannons, fxFireworks, fxStarShower, fxEmojiParty];
  function celebrate() { pick(CELEBRATIONS)(); }

  // ---------- events ----------
  addBtn.addEventListener("click", () => { addName(nameInput.value); nameInput.value = ""; nameInput.focus(); });
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { addName(nameInput.value); nameInput.value = ""; }
  });
  spinBtn.addEventListener("click", () => {
    if (!spinning) { popAt(spinBtn, PALETTE, 30); blip(180, 60, "sawtooth", 0.25, 0.08); }
    spin();
  });
  resetBtn.addEventListener("click", () => {
    if (state.result) { popAt(resetBtn, BAD, 16); blip(900, 150, "sine", 0.3, 0.08); }
    state.result = null;
    save();
    renderResult();
    updateControls();
  });

  // ---------- seed first run ----------
  if (state.roster.length === 0 && state.result === null) {
    ["Alex", "Bailey", "Casey", "Devon", "Ellis", "Frankie", "Gray", "Harper", "Indy", "Jordan", "Kai", "Logan", "Morgan", "Noel"].forEach((n) =>
      state.roster.push({ id: uid(), name: n, enabled: true })
    );
    save();
  }

  // ---------- init ----------
  renderRoster();
  renderSuperlatives();
  renderResult();
  updateControls();
})();
</script>
</body>
</html>
